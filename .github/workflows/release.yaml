name: Release Chrome Extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from manifest.json
        id: manifest
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Extension version: ${VERSION}"

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          EXPECTED_TAG="v${{ steps.manifest.outputs.version }}"
          if [ "${TAG_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${TAG_NAME} does not match manifest version ${EXPECTED_TAG}"
            exit 1
          fi

      - name: Package extension
        run: |
          VERSION="${{ steps.manifest.outputs.version }}"
          ASSET_NAME="weblio-keybind_v${VERSION}.zip"
          mkdir -p weblio-keybind
          cp manifest.json content.js README.md weblio-keybind/
          zip -r "${ASSET_NAME}" weblio-keybind
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "weblio-keybind_v${{ steps.manifest.outputs.version }}"
          files: |
            ${{ env.asset_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

